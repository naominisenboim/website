<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecorScout | Find Cheap Furniture Near You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #10b981;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            width: 100%;
            flex: 1;
        }

        .search-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .input-group input, .input-group select {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
        }

        .range-slider {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .range-slider input[type="range"] {
            flex: 1;
            accent-color: var(--primary);
        }

        .range-value {
            font-weight: 600;
            min-width: 60px;
            text-align: right;
            font-size: 0.9rem;
        }

        .btn-search {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            height: 44px;
        }

        .btn-search:hover {
            background: var(--primary-hover);
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .results-count {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.4);
        }

        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #0f172a;
        }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-tag {
            align-self: start;
            background: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .card-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }

        .card-distance {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card-source {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .btn-link {
            display: block;
            text-align: center;
            background: #334155;
            color: white;
            text-decoration: none;
            padding: 0.6rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        .btn-link:hover {
            background: #475569;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            grid-column: 1 / -1;
            color: var(--text-muted);
        }

        footer {
            border-top: 1px solid var(--border);
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>🔍</span> DecorScout
        </div>
    </header>

    <div class="container">
        <section class="search-panel">
            <form id="search-form" onsubmit="event.preventDefault(); filterResults();">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="location">Your Location</label>
                        <input type="text" id="location" placeholder="e.g. San Luis Obispo, CA" value="San Luis Obispo, CA">
                    </div>

                    <div class="input-group">
                        <label for="category">Furniture Type</label>
                        <select id="category">
                            <option value="all">All Items</option>
                            <option value="sofa">Sofas & Couches</option>
                            <option value="chair">Chairs & Seating</option>
                            <option value="table">Tables & Desks</option>
                            <option value="decor">Decor & Lighting</option>
                            <option value="storage">Storage & Dressers</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="distance">Max Distance (<span id="dist-val">25</span> miles)</label>
                        <div class="range-slider">
                            <input type="range" id="distance" min="5" max="100" value="25" step="5" oninput="document.getElementById('dist-val').innerText = this.value">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="budget">Max Budget ($<span id="budget-val">350</span>)</label>
                        <div class="range-slider">
                            <input type="range" id="budget" min="10" max="1000" value="350" step="10" oninput="document.getElementById('budget-val').innerText = this.value">
                        </div>
                    </div>

                    <button type="submit" class="btn-search">Find Deals</button>
                </div>
            </form>
        </section>

        <div class="controls-bar">
            <div class="results-count" id="results-count">Showing results...</div>
        </div>

        <main class="grid" id="results-grid"></main>
    </div>

    <footer>
        <p>&copy; 2026 DecorScout. Aggregating budget deals across top marketplaces.</p>
    </footer>

    <script>
        const mockInventory = [
            {
                id: 1,
                title: "Mid-Century Velvet Armchair",
                category: "chair",
                price: 85,
                distance: 4,
                source: "Facebook Marketplace",
                image: "https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=500&q=80",
                link: "https://facebook.com/marketplace"
            },
            {
                id: 2,
                title: "Minimalist Oak Coffee Table",
                category: "table",
                price: 45,
                distance: 12,
                source: "Craigslist",
                image: "https://images.unsplash.com/photo-1533090161767-e6ffed986c88?w=500&q=80",
                link: "https://craigslist.org"
            },
            {
                id: 3,
                title: "3-Seat Grey Fabric Sofa",
                category: "sofa",
                price: 220,
                distance: 18,
                source: "OfferUp",
                image: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=500&q=80",
                link: "https://offerup.com"
            },
            {
                id: 4,
                title: "Boho Floor Standing Mirror",
                category: "decor",
                price: 35,
                distance: 8,
                source: "IKEA Clearance",
                image: "https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=500&q=80",
                link: "https://ikea.com"
            },
            {
                id: 5,
                title: "Industrial 5-Tier Bookshelf",
                category: "storage",
                price: 60,
                distance: 15,
                source: "Wayfair Outlet",
                image: "https://images.unsplash.com/photo-1594620302200-9a762244a156?w=500&q=80",
                link: "https://wayfair.com"
            },
            {
                id: 6,
                title: "Modern Ceramic Table Lamp",
                category: "decor",
                price: 25,
                distance: 3,
                source: "Target Circle Deals",
                image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=500&q=80",
                link: "https://target.com"
            },
            {
                id: 7,
                title: "Solid Wood Dining Table Set",
                category: "table",
                price: 310,
                distance: 22,
                source: "Facebook Marketplace",
                image: "https://images.unsplash.com/photo-1617806118233-18e1de247200?w=500&q=80",
                link: "https://facebook.com/marketplace"
            },
            {
                id: 8,
                title: "Tufted Leather Recliner",
                category: "chair",
                price: 150,
                distance: 28,
                source: "OfferUp",
                image: "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500&q=80",
                link: "https://offerup.com"
            }
        ];

        function filterResults() {
            const category = document.getElementById('category').value;
            const maxDistance = parseFloat(document.getElementById('distance').value);
            const maxBudget = parseFloat(document.getElementById('budget').value);
            const location = document.getElementById('location').value || 'your area';

            const filtered = mockInventory.filter(item => {
                const matchesCategory = category === 'all' || item.category === category;
                const matchesDistance = item.distance <= maxDistance;
                const matchesBudget = item.price <= maxBudget;
                return matchesCategory && matchesDistance && matchesBudget;
            });

            // Sort by price ascending (cheapest first)
            filtered.sort((a, b) => a.price - b.price);

            renderResults(filtered, location);
        }

        function renderResults(items, location) {
            const grid = document.getElementById('results-grid');
            const count = document.getElementById('results-count');

            count.innerText = `Found ${items.length} affordable deal${items.length === 1 ? '' : 's'} near ${location}`;

            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>No deals match your criteria</h3>
                        <p style="margin-top: 0.5rem;">Try increasing your distance range or budget to see more options.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = items.map(item => `
                <article class="card">
                    <img src="${item.image}" alt="${item.title}" class="card-img" loading="lazy">
                    <div class="card-body">
                        <span class="card-tag">${item.category}</span>
                        <h2 class="card-title">${item.title}</h2>
                        <div class="card-source">Found on ${item.source}</div>
                        <div class="card-meta">
                            <span class="card-price">$${item.price}</span>
                            <span class="card-distance">📍 ${item.distance} mi away</span>
                        </div>
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="btn-link">View Deal</a>
                    </div>
                </article>
            `).join('');
        }

        // Initial Load
        filterResults();
    </script>
</body>
</html>
